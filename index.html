<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <div class="logo-area">
                <h1>TaskFlow</h1>
                <span class="badge" id="totalTasksCount">0 Tasks</span>
            </div>
            
            <!-- Add Task Form -->
            <form id="taskForm" class="task-form">
                <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
                <button type="submit" id="addTaskBtn">Add Task</button>
            </form>
        </header>

        
        <div class="kanban-board">
            
            
            <div class="column" data-status="todo">
                <div class="column-header todo-header">
                    <h3>To Do</h3>
                    <span class="count-badge" id="todoCount">0</span>
                </div>
                <div class="task-list" id="todoList">
                    

                </div>
            </div>

        
            <div class="column" data-status="in-progress">
                <div class="column-header progress-header">
                    <h3>In Progress</h3>
                    <span class="count-badge" id="progressCount">0</span>
                </div>
                <div class="task-list" id="inProgressList">
                    

                </div>
            </div>

            
            <div class="column" data-status="done">
                <div class="column-header done-header">
                    <h3>Done</h3>
                    <span class="count-badge" id="doneCount">0</span>
                </div>
                <div class="task-list" id="doneList">
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
